<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Biblioteca</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="shelf-header">
  <div class="header-top">
    <h1>Mi Biblioteca</h1>
    <p class="tagline">Los libros que he leído, los que estoy leyendo y los que esperan turno</p>
  </div>

  <div class="shelf" aria-label="Recomendaciones">
    <div class="shelf-track" id="shelfTrack">
      <!-- spines injected by JS -->
    </div>
    <button class="shelf-nav prev" id="shelfPrev" aria-label="Anterior">&#8249;</button>
    <button class="shelf-nav next" id="shelfNext" aria-label="Siguiente">&#8250;</button>
    <div class="shelf-ledge"></div>
  </div>
</header>

<main>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="reading" role="tab" aria-selected="true">
      <span class="tab-index">I</span> Leídos &amp; Leyendo
    </button>
    <button class="tab" data-tab="wishlist" role="tab" aria-selected="false">
      <span class="tab-index">II</span> Quiero leer
    </button>
  </nav>

  <section class="tab-panel active" id="panel-reading">
    <div class="grid" id="gridReading"></div>
    <p class="empty-state" id="emptyReading" hidden>Aún no has añadido ningún libro leído. Pulsa el botón <strong>+</strong> para empezar tu estantería.</p>
  </section>

  <section class="tab-panel" id="panel-wishlist">
    <div class="grid" id="gridWishlist"></div>
    <p class="empty-state" id="emptyWishlist" hidden>Tu lista de deseos está vacía. Añade libros que quieras leer más adelante.</p>
  </section>
</main>

<button class="fab" id="btnAdd" aria-label="Añadir libro">+</button>

<div class="toolbar-float">
  <button class="pill-btn" id="btnExport" title="Descargar tu biblioteca como JSON">&#8681; Exportar</button>
  <label class="pill-btn" title="Cargar un archivo JSON de tu biblioteca">
    &#8679; Importar
    <input type="file" id="fileImport" accept="application/json" hidden>
  </label>
</div>

<!-- MODAL: Add / Edit book -->
<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="Cerrar">&times;</button>
    <h2 id="modalTitle">Añadir libro</h2>

    <div class="field">
      <label for="searchInput">Buscar libro</label>
      <input type="text" id="searchInput" placeholder="Escribe el título del libro..." autocomplete="off">
      <div class="autocomplete-list" id="autocompleteList" hidden></div>
    </div>

    <div class="cover-row">
      <div class="cover-preview" id="coverPreview">
        <span id="coverPlaceholder">Sin portada</span>
        <img id="coverImg" alt="Portada del libro" hidden>
      </div>
      <div class="cover-actions">
        <label class="pill-btn small" title="Sacar o subir una foto de la portada">
          &#128247; Añadir foto
          <input type="file" id="coverCamera" accept="image/*" capture="environment" hidden>
        </label>
        <input type="text" id="coverUrlInput" placeholder="o pega un enlace de imagen">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="titleInput">Título</label>
        <input type="text" id="titleInput" placeholder="Título del libro">
      </div>
      <div class="field small">
        <label for="yearInput">Año</label>
        <input type="text" id="yearInput" placeholder="2024" inputmode="numeric">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="authorInput">Escritor/a</label>
        <input type="text" id="authorInput" placeholder="Nombre del autor">
      </div>
      <div class="field">
        <label for="publisherInput">Editorial</label>
        <input type="text" id="publisherInput" placeholder="Editorial">
      </div>
    </div>

    <div class="field">
      <label for="genreInput">Género</label>
      <input type="text" id="genreInput" placeholder="Novela, ensayo, ciencia ficción...">
    </div>

    <div class="field">
      <label>Estado</label>
      <div class="status-choice" id="statusChoice">
        <button type="button" class="status-opt" data-status="quiero_leer">Quiero leer</button>
        <button type="button" class="status-opt" data-status="leyendo">Leyendo</button>
        <button type="button" class="status-opt" data-status="leido">Leído</button>
      </div>
    </div>

    <div class="field">
      <label>Mi valoración <span class="optional">(puedes dejarla para más adelante)</span></label>
      <div class="stars-input" id="starsInput">
        <button type="button" class="star" data-val="1">&#9733;</button>
        <button type="button" class="star" data-val="2">&#9733;</button>
        <button type="button" class="star" data-val="3">&#9733;</button>
        <button type="button" class="star" data-val="4">&#9733;</button>
        <button type="button" class="star" data-val="5">&#9733;</button>
        <button type="button" class="star-clear" id="starClear">borrar</button>
      </div>
    </div>

    <div class="field">
      <label for="commentsInput">Mis comentarios <span class="optional">(opcional)</span></label>
      <textarea id="commentsInput" rows="3" placeholder="¿Qué te ha parecido?"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" id="btnDelete" hidden>Eliminar libro</button>
      <button class="btn-primary" id="btnSave">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
